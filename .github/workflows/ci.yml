name: CI
on:
  push: { branches: [master, main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable', cache: true }
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }
      - run: go test ./... -race
      # Generated files must match the catalog; this is the DO NOT EDIT gate.
      - run: go test ./tools/gen/server/ -run TestGeneratedFilesMatchTheCatalog -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable', cache: true }
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable', cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
