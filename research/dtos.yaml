      table — same field, minor doc typing inconsistency.'
  - name: description
    type: string
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: '"Описание" comment, String(2000) per the response table (save table just says String).'
  - name: appearance
    type: string
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: '"Требования к оформлению, подаче и реализации" comment, String(2000).'
  - name: organoleptic
    type: string
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: '"Органолептические показатели качества" comment, String(2000).'
  - name: outputComment
    type: string
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: '"Суммарный выход" (total yield) comment, String(2000).'
  enums:
  - name: ProductSizeAssemblyStrategy
    values:
    - COMMON
    - SPECIFIC
    note: See productSizeAssemblyStrategy field note above — third-party-observed "SEPARATE" deliberately excluded per the
      docs-are-source-of-truth rule.
  - name: ProductWriteoffStrategy
    values:
