- name: AssignmentEntryDto
  format: xml
  source_slug: rabota-s-dannymi-brigad
  used_by:
  - /resto/api/employees/waiterTeams/assignments
  - /resto/api/employees/waiterTeams/assignments/byDepartment/{departmentId}
  fields:
  - name: employeeId
    type: uuid
    date_format: null
    required: true
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: null
  - name: teamId
    type: uuid
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: 'If the tag is omitted or empty, the employee is removed from whatever team they were previously assigned. PRIORITY:
      the assignment map is NOT garbage-collected when a team or employee is deleted — a stale reference to a deleted team
      is deliberately LEFT IN PLACE (protects the team''s roster if the team was deleted by accident and immediately restored),
      and a deleted/fired employee''s assignment is likewise left in place (removing it could implicitly widen order visibility:
      a team member sees only their team''s orders, but an employee with no team sees all of the restaurant''s orders). Cleanup
      of stale entries is the API consumer''s responsibility.'
