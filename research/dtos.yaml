- name: ApiError
  format: text
  source_slug: opisanie-oshibok
  used_by:
  - '*'
  fields:
  - name: httpStatus
    type: enum
    date_format: null
    required: true
    since: null
    read_only: true
    declared_but_unimplemented: false
    enum:
    - '400'
    - '401'
    - '403'
    - '404'
    - '409'
    - '500'
    of: null
    aliases: []
    note: 'HttpStatus meanings — 400: malformed/deserialization error in the request, or a data completeness problem in the
      request or stored data (e.g. "Wrong date format: 2019-0513 15:26"). 401: not authenticated (missing key param/cookie,
      session idle-timed-out — usually ~1h, server restarting/restarted). 403: authenticated but forbidden — either no licence
      for this API/subsystem module ("Module %s is blocked within current license"), the connection-count limit for the API/module
      is exceeded ("License enhancement is required: no connections available for module %s"), or the user lacks the specific
      right the module requires ("Permission denied"). 404: object not found / malformed path. 409: a business-logic error,
      server returns a message meant for the end user (e.g. "Доступ запрещен КОД_ПРАВА", negative-stock postings, backdating
      restrictions). 500: internal server error, arbitrary Java exception text.'
  - name: message
    type: string
    date_format: null
    required: true
    since: null
    read_only: true
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: 'Any resto/api v1 or v2 method may return this instead of its documented response, body Content-Type text/plain.
      409 is the one status whose message is localized and meant to be shown to the end user verbatim; every other status''s
      message is UNLOCALIZED plain text and may contain technical detail (UUIDs of affected objects). Text may contain mandatory
      line breaks (render with CSS white-space: pre-line) and is NOT escaped — may contain characters dangerous to js/html/sql
      contexts if echoed into a UI. An html/xhtml response instead of text/plain indicates a network/proxy/DNS/server-misconfiguration
      problem (or an empty Tomcat with no RMS/Chain deployed), not an application error. Server logs (full.log, access.csv)
      may carry more detail (including WARN-level entries) than is exposed to the API caller.'
  enums:
  - name: HttpStatus
    values:
    - '400'
    - '401'
    - '403'
    - '404'
    - '409'
    - '500'
