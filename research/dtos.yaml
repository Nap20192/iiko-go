      always unbounded).
  - name: assembledAmount
    type: decimal
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: null
    aliases: []
    note: Batch/yield norm for the prepared dish (норма закладки).
  - name: productWriteoffStrategy
    type: enum
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum:
    - ASSEMBLE
    - DIRECT
    of: null
    aliases: []
    note: 'ASSEMBLE = write off ingredients (typical for prepared/полуфабрикаты and dishes not tracked on the store balance).
      DIRECT = write off the product itself (typical for goods and prepared items whose own balance IS tracked). Documented
      in the field table but absent from every getAll/getTree/getAssembled example payload — only appears in byId/getHistory/save
      examples; endpoint-visibility asymmetry, see byId endpoint note.

      '
  - name: effectiveDirectWriteoffStoreSpecification
    type: object
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: StoreSpecification
    aliases: []
    note: Departments where this element is written off whole (not by ingredient).
  - name: productSizeAssemblyStrategy
    type: enum
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum:
    - COMMON
    - SPECIFIC
    of: null
    aliases: []
    note: 'PRIORITY — enum recorded EXACTLY as the docs declare it, nothing more. COMMON: chart has rows per product+department
      only; the computed write-off quantity is multiplied by the write-off factor configured on the product card and frozen
      into the document at posting time. SPECIFIC ("Отдельные тех.карты для размеров" / separate tech cards per size): chart
      has rows per product+size+department; document-frozen write-off factors are NOT applied. WARNING FROM DOCS: mixing chart
      types within one nomenclature element''s chart hierarchy is discouraged — a chart may silently contain rows for BOTH
      strategies even if iikoOffice doesn''t show them; which rows apply is decided by the ROOT dish''s size-strategy setting,
      not each intermediate prepared item''s own chart, so the same prepared item can be written off differently depending
      on which dish it''s nested under. Also: if a chart lacks the rows for the "wrong" strategy, multiplying it against a
      chart of the other strategy always yields zero (no write-off occurs) — this is the constraint documented in this repo''s
      CLAUDE.md as "a mismatch with the root dish silently produces zero write-off." THIRD-PARTY NOTE (out of scope for the
      enum list above): a production client observed in the wild (Nap20192/bakery) emits a third value, "SEPARATE", not declared
      anywhere in these docs. Per the SCHEMA.md contract this value is NOT added to the `enum:` list above — it is recorded
      here only as a fact to confirm against a live server before trusting it (see this repo''s research/ and CLAUDE.md notes
      on the same point).

      '
  - name: items
    type: array
    date_format: null
    required: false
    since: null
    read_only: false
    declared_but_unimplemented: false
    enum: null
    of: AssemblyChartItemDto
    aliases: []
    note: null
  - name: technologyDescription
    type: string
    date_format: null
    required: false
    since: null
