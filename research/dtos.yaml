      4) per source chart; amount = ROUND(PRODUCT(baseAmount over the chain), 3) — PRODUCT rounds intermediate multiplication
      to 32 decimal places. For an actual document, the exact formula is: writeoffAmount = ROUND(amount * dishAmount * writeoffFactor,
      9), where dishAmount is the document''s dish quantity (3 decimals) and writeoffFactor is the write-off coefficient frozen
